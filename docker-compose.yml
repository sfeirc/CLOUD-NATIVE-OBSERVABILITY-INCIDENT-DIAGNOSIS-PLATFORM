name: incident-lens

x-service: &service
  build: .
  restart: unless-stopped
  environment: &service-env
    BIND_HOST: 0.0.0.0
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_METRIC_EXPORT_INTERVAL: "3000"
    ORDER_URL: http://order-service:8000
    PAYMENT_URL: http://payment-service:8000
    DATABASE_URL: postgresql://incident:incident@postgres:5432/incident
    REDIS_URL: redis://redis:6379/0
  depends_on:
    otel-collector:
      condition: service_started
  mem_limit: 256m
  cpus: 0.75
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  checkout-api:
    <<: *service
    command: ["api"]
    environment:
      <<: *service-env
      SERVICE_VERSION: v1.0.0
    ports: ["8080:8000"]
    depends_on:
      order-service: {condition: service_healthy}
      otel-collector: {condition: service_started}

  order-service:
    <<: *service
    command: ["order"]
    environment:
      <<: *service-env
      SERVICE_VERSION: v1.2.0
    depends_on:
      payment-service: {condition: service_healthy}
      otel-collector: {condition: service_started}

  payment-service:
    <<: *service
    command: ["payment"]
    environment:
      <<: *service-env
      SERVICE_VERSION: ${PAYMENT_VERSION:-v1.7.0}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      otel-collector: {condition: service_started}

  chaos:
    <<: *service
    command: ["chaos"]
    ports: ["8081:8000"]
    environment:
      <<: *service-env
      SERVICE_VERSION: v0.1.0
    depends_on:
      checkout-api: {condition: service_healthy}
      order-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
      otel-collector: {condition: service_started}

  diagnosis:
    build: .
    command: ["diagnosis"]
    restart: unless-stopped
    environment:
      BIND_HOST: 0.0.0.0
    mem_limit: 256m
    cpus: 0.75
    ports: ["8082:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: incident
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    mem_limit: 256m
    depends_on:
      diagnosis: {condition: service_healthy}
      tempo: {condition: service_started}
      loki: {condition: service_started}
    ports: ["4317:4317", "4318:4318", "8889:8889"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle", "--web.enable-remote-write-receiver"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    mem_limit: 256m

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]
    mem_limit: 128m

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]
    mem_limit: 512m

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports: ["3100:3100"]
    mem_limit: 256m

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics correlations
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    mem_limit: 256m
    depends_on: [prometheus, tempo, loki]

volumes:
  postgres-data:
  prometheus-data:
  tempo-data:
  loki-data:
