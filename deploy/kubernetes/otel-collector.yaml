apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector, namespace: incident-lens}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 192}
      batch: {timeout: 1s}
    exporters:
      prometheus: {endpoint: 0.0.0.0:8889}
      otlphttp/diagnosis: {endpoint: http://diagnosis:8000}
      debug: {verbosity: basic}
    service:
      pipelines:
        metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus, otlphttp/diagnosis]}
        traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/diagnosis, debug]}
        logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/diagnosis, debug]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: incident-lens}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.132.0
          args: [--config=/etc/otelcol/config.yaml]
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: metrics, containerPort: 8889}
          volumeMounts: [{name: config, mountPath: /etc/otelcol}]
          readinessProbe: {tcpSocket: {port: otlp-http}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: otlp-http}, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 256Mi}}
      volumes: [{name: config, configMap: {name: otel-collector}}]
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector, namespace: incident-lens}
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: metrics, port: 8889, targetPort: metrics}

